header:
  eyebrow: Our mission
  title: Good Question would not exist without a strong community.
  paragraphs:
    - We endeavor to create a space where members feel safe, welcome, and able to contribute in whatever way they are inspired to contribute.
    - On a basic level, we want all camp members to be good citizens of BRC. More importantly, we want members to feel excited by and committed to the hard work it takes to make a camp function.
values_title: Camp values
values:
  - inclusivity
  - participation
  - discovery
  - community
  - growth
  - honesty
  - nourishment
  - kindness
principles:
  eyebrow: Camp principles
  title: How we camp together.
  warning: Consequences for breaking the code of conduct range from a serious conversation all the way up to being asked to leave camp.
  items:
    - title: Leave No Trace
      paragraphs:
        - Our camp is committed to being good stewards of the Playa. We clean up MOOP anywhere we see it.
        - "We make sure that our camp infrastructure, our bicycles, and our costumes don't have elements that could accidentally become MOOP (matter out of place): sequins, feathers, glitter, styrofoam, glass, glued-on items, hair (be mindful when grooming), clothing tags. Everything generated by humans that wasn't on the Playa when we arrived is MOOP."
    - title: Participation
      paragraphs:
        - Everyone is welcomed with the opportunity to participate and contribute. There is no audience. Everyone is a participant. We welcome the stranger, embrace newcomers, and actively pursue hospitality.
        - Ours is a gifting culture in which participants freely contribute without the expectation of reward or payment. Our gifts take many forms. When we give the gift of our time, effort, energy, art, and passion, we create an environment of abundance, where there is plenty for all.
        - "Our community is a do-ocracy: if you see a need, fill it. If there is a job to be done, do it. If you don't like how something is done, volunteer to do it better. All campers will participate in:"
      list:
        - Selected interactivity shifts (M–F)
        - Selected meal preparation
        - General camp support
        - Leave No Trace (LNT) efforts
      after_list:
        - We know not everyone can come early and leave late, so we ask that you choose to help primarily with camp set-up (Fri–Sun pre-burn) or camp strike on Saturday (Man burn day) and Sunday (Temple burn day).
        - "Participation in other camp events and outings is encouraged (Virgin excursions, the Wednesday Catholic School Girl pub crawl, etc.). Show up and give your best self to the camp. Don't be a spectator!"
    - title: Respect
      paragraphs:
        - We respect the needs of both the camp as a whole and the individuals who form it. We seek to create an environment of tolerance and mutual support where we all have a sense of involvement and belonging.
        - "We treat each other with equality, tolerance, and respect, even when we disagree. If there is conflict or drama, it is resolved expediently and peacefully, without dragging others in or impacting others' experience."
    - title: Inclusivity
      paragraphs:
        - We are committed to being a welcoming camp that celebrates all people, bodies, desires, connections, and choices. All are welcome to participate, join, and share in experiences, or go their own way.
        - Our camp is committed to making sure every camper knows and feels that they are wanted, supported, and encouraged to be who they are (unless you are an asshole, then please don't be that). We extend this to our campers, customers, and anyone else who enters camp.
    - title: Consent
      paragraphs:
        - "We hold ourselves to high standards of respect for others and respect everyone's right to bodily autonomy. We are mindful of everyone's right to say \"yes\" or \"no\" to any activity. To create a space where everyone feels safe to express themselves artistically and, where appropriate, sexually, we consciously develop a culture of consent."
        - "Consent is an agreement between two or more people to engage or not engage in specific activities together. It occurs when people voluntarily agree to the proposal or desires of the other. Expressed consent is clearly and unmistakably stated, rather than implied. It may be given in writing, by speech, or non-verbally (e.g. a clear gesture such as a nod)."
        - "For consent to be valid, it is given freely and continuously by a person with the capacity to do so. We graciously accept \"no\" and recognize that consent previously given can be revoked at any time. Consent is not just about sex; it's needed before acting on any desire involving others."
        - We value the transformative experience of consensual touch, play, and interaction, and we believe consent plays a vital part in our social cohesion.
    - title: Self-care
      paragraphs:
        - "You are responsible for monitoring and tending to your own mental, emotional, and physical well-being. Burning Man is a demanding and potentially overstimulating environment, and it is up to you to navigate within your own personal limits. Be honest about your needs and bring the supplies, medication, and tools to keep yourself happy, healthy, and sane."
        - "In keeping our commitments, we trust others to meet the commitments they've made to us. We don't expect others to clean up after us. Our trash and belongings (physical and mental) are ours to manage."
        - "Radical self-reliance means don't count on others to make your time at BM great. Create it yourself. If you're not getting what you need, think about what you can do."
        - "At the same time, if you're in a situation, please communicate and ask for help. Radical self-reliance is essential, but know you're part of a loving community that wants to be there for each other."
        - "Know your limits and play within them, and within the boundaries you've set. If you've signed up for a shift or camp contribution, please don't be irresponsible before that duty. You'll be impacting your campmates and everyone's experience of Burning Man."
    - title: Communal effort
      paragraphs:
        - "Do the duties you've signed up for while on the Playa. Don't expect others to remind you."
        - "If you see something that needs to be done, do it. Don't wait for someone else to take care of it. If you're not sure, ask questions. Respect and participate in a culture of consent with campmates and all visitors to our camp."
    - title: Be gentle, kind, and generous
      paragraphs:
        - Sometimes the Playa can be hard on campers, and sometimes we might need some extra help, love, patience, and understanding.
