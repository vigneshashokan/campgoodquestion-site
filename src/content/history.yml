header:
  eyebrow: Our history
  title: "The dust forgets. We don't."
  intro: Every August the city rises from nothing, and every September it vanishes. These are the snapshots we kept.
years:
  - year: 2024
    title: The lantern is lit
    note: "Our very first year. A kettle, a griddle, and a handful of people asking each other good questions way out at 7:45 & F."
    address_time: "7:45"
    address_street: F
    map_label: below
    photo:
  - year: 2025
    title: Closer to the heart
    note: "We moved in toward the Man and settled at 4:30 & D. More tea, more questions, more strangers who didn't stay strangers."
    address_time: "4:30"
    address_street: D
    map_label: left
    photo:
  - year: 2026
    title: A new corner of the city
    note: "The city rebuilt, and so did we. Tea at dusk, questions by night, and dosas on Tuesdays and Thursdays at 4:15 & E."
    address_time: "4:15"
    address_street: E
    map_label: right
    photo:
  - year: 2027
    title: Still unwritten
    note: Where will we pitch our tents next? Who will be sitting on the cushions? Good question. Maybe you.
