# Pages CMS config (https://pagescms.org/docs). Keep fields in sync with src/content.config.ts.
media:
  input: public/images
  output: /images
content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    view:
      fields: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description (shown in search results)
        type: string
      - name: body
        label: Content
        type: rich-text
